name: Tsvima
options:
  bundleIdPrefix: io.github.meko123456
  deploymentTarget:
    iOS: "16.0"
targets:
  Tsvima:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.meko123456.tsvima
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tsvima
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        # :shared builds iosArm64 and iosSimulatorArm64 and deliberately not iosX64 - the Intel-Mac
        # simulator, which no machine here or on a macOS runner is. Xcode does not know that, and a
        # generic "iOS Simulator" destination asks for x86_64 as well, which fails the Kotlin
        # plugin's architecture check. Saying so here keeps that a one-line fact about this project
        # rather than a flag every xcodebuild invocation has to remember.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
    preBuildScripts:
      - name: Build Shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          export JAVA_HOME="${JAVA_HOME:-/Applications/Android Studio.app/Contents/jbr/Contents/Home}"
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
