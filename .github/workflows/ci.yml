name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Ubuntu builds the shared Kotlin + Android app; the ios job below covers Kotlin/Native.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build shared + Android, lint and unit tests
        run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug :androidApp:lintDebug :androidApp:testDebugUnitTest --stacktrace

      # Guards the R8 config and release-only lint. Debug never runs the shrinker, so without this
      # a keep-rules mistake first appears when somebody builds a release by hand - and
      # lintVitalRelease is the release-blocking subset of lint, which debug lint does not cover.
      - name: Release build (R8 + release-blocking lint)
        run: ./gradlew :androidApp:assembleRelease :androidApp:lintVitalRelease --stacktrace

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: androidApp/build/reports/lint-results-debug.html

  ios:
    # :shared claimed for months to be "iOS-ready" with Android as its only target, which is a
    # claim nothing could check - the README called this a KMM project on the strength of it and
    # had to be corrected. iosArm64 and iosSimulatorArm64 now exist, and this job is what keeps
    # the claim honest on every branch instead of on whoever remembers to compile it by hand.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Runs the shared tests on a simulator rather than only compiling them. Compiling proves the
      # code is valid Kotlin/Native; running proves it behaves the same there, which is the whole
      # reason the parsers, the score and the cache codec live in :shared.
      - name: Test the shared code on iOS
        run: |
          # iosArm64 is what a real iPhone links against. It cannot run tests on a runner, so it
          # is compiled - a target that is never built is not a target.
          ./gradlew :shared:iosSimulatorArm64Test :shared:compileKotlinIosArm64 --stacktrace

  iosApp:
    # The SwiftUI app gets built, not just the shared framework it links against. This repo has
    # already been bitten once by a claim nothing compiled - ":shared is iOS-ready" with no iOS
    # target - and an iOS app that nothing builds would rot exactly the same way.
    #
    # The .xcodeproj is generated by XcodeGen from project.yml rather than committed, so generating
    # it is part of the check: a project.yml that no longer produces a buildable project is the same
    # failure as a source file that will not compile.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: iosApp
        run: xcodegen generate

      # A generic simulator destination rather than a named device: runner images change which
      # simulators they carry, and a hardcoded "iPhone 16" turns an image update into a red build
      # for no reason.
      #
      # Building the Shared framework is a pre-build step of the Xcode target, so this also proves
      # the Gradle and Xcode halves still agree about where that framework lands.
      - name: Build the iOS app
        working-directory: iosApp
        run: |
          xcodebuild -project Tsvima.xcodeproj -scheme Tsvima \
                     -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
                     -configuration Debug build

  release-launches:
    # Building the release proves R8 ran, not that the result starts. On 30 September 2026 three
    # apps in this collection turned out to have minified builds that died before their first frame
    # (R8 full mode had stripped a constructor a library reaches for by reflection), and every check
    # was green. This app was one of them (6ddd942). This installs the R8 build on an emulator,
    # opens it, and fails if it crashes or is not running fifteen seconds later. Proven both ways in
    # Nabiji #13.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # CI has no release key, so the build comes out unsigned. Any key will do for installing it
      # on a throwaway emulator, so this makes one up.
      - name: Build the minified release and sign it with a throwaway key
        run: |
          ./gradlew :androidApp:assembleRelease --stacktrace
          keytool -genkeypair -keystore "$RUNNER_TEMP/launch.jks" -storepass launchcheck \
            -keypass launchcheck -alias launch -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=release launch check"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 "$(ls androidApp/build/outputs/apk/release/*.apk | head -1)" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/launch.jks" --ks-pass pass:launchcheck \
            --key-pass pass:launchcheck --out "$RUNNER_TEMP/release.apk" "$RUNNER_TEMP/aligned.apk"

      # The emulator wants more disk than ubuntu-latest leaves free, and it needs KVM.
      - name: Free disk space and enable KVM
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup \
                      /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open the release build on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/launch-release.sh ${{ runner.temp }}/release.apk
